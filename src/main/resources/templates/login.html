<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabecera('Ingresá')}"></head>
<body>
<div class="contenedor-app">
  <header th:replace="~{fragments/layout :: encabezado}"></header>

  <main class="mx-auto p-4" style="max-width: 420px;">
    <h1 class="h2 fw-bold mt-3">Ingresá</h1>
    <p class="text-secondary">Iniciá sesión para continuar</p>

    <div th:if="${ok}" class="alert alert-success" th:text="${ok}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/login}" method="post">
      <div class="mb-3">
        <label for="correo" class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" id="correo" name="correo"
               th:value="${correo}" placeholder="tucorreo@ejemplo.com" required>
      </div>
      <div class="mb-3">
        <label for="clave" class="form-label">Clave</label>
        <input type="password" class="form-control" id="clave" name="clave"
               placeholder="Ingresá tu clave" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-dark w-100">Ingresar</button>
      <p class="mt-3 text-center">¿No tenés cuenta? <a th:href="@{/registro}">Registrate</a></p>
    </form>
  </main>
</div>
</body>
</html>
