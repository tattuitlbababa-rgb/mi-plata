<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabecera('Editar movimiento')}"></head>
<body>
<div class="contenedor-app">
  <nav th:replace="~{fragments/layout :: barra}"></nav>

  <main class="p-4">
    <h1 class="h3 fw-bold mb-0">EDITAR MOVIMIENTO</h1>
    <p th:text="${tipo}">Gasto</p>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/movimientos/{id}/editar(id=${id})}" th:object="${form}" method="post"
          class="bg-white p-4 mx-auto" style="max-width: 480px;">

      <div class="mb-3">
        <label for="fecha" class="form-label">Fecha</label>
        <input type="date" class="form-control" th:field="*{fecha}" required>
      </div>

      <div class="mb-3">
        <label for="descripcion" class="form-label">Descripción</label>
        <input type="text" class="form-control" th:field="*{descripcion}" maxlength="150" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Categoría</label>
        <input type="text" class="form-control" th:value="${categoriaNombre}" disabled>
        <div class="form-text">La categoría no se puede cambiar.</div>
      </div>

      <div class="mb-3">
        <label for="importe" class="form-label">Importe</label>
        <div class="input-group">
          <span class="input-group-text">$</span>
          <input type="number" class="form-control" th:field="*{importe}"
                 step="0.01" min="0.01" required>
        </div>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-dark flex-grow-1">Guardar cambios</button>
        <a th:href="@{/movimientos}" class="btn btn-outline-dark">Cancelar</a>
      </div>
    </form>
  </main>
</div>
</body>
</html>
